name: Build ARM64 Kernel .deb with Cosmic Clang

on:
  push:
    branches: [ "fourteen" ]
  pull_request:
    branches: [ "fourteen" ]
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchain/cosmic-clang
          key: cosmic-clang-v1-${{ hashFiles('.github/workflows/*') }}
          restore-keys: |
            cosmic-clang-v1-

      - name: Clone Cosmic Clang (jika belum ada di cache)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          if [ ! -d "toolchain/cosmic-clang" ]; then
              git clone --depth 1 "https://gitlab.com/DX4GREY/cosmic-clang.git" toolchain/cosmic-clang
          else
            echo "Toolchain ditemukan di cache, lewati cloning."
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc libssl-dev ccache rsync \
            libelf-dev libncurses-dev dpkg-dev debhelper

      - name: Setup build environment
        run: |
          TOOLCHAIN_DIR="$GITHUB_WORKSPACE/toolchain/cosmic-clang"
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          export KBUILD_BUILD_USER=builder
          export KBUILD_BUILD_HOST=dlovely-faz
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export HOSTCC=clang
          export ARCH=arm64

          echo "PATH=$PATH" >> $GITHUB_ENV
          echo "CROSS_COMPILE=$CROSS_COMPILE" >> $GITHUB_ENV
          echo "CROSS_COMPILE_COMPAT=$CROSS_COMPILE_COMPAT" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=$CLANG_TRIPLE" >> $GITHUB_ENV
          echo "CC=$CC" >> $GITHUB_ENV
          echo "HOSTCC=$HOSTCC" >> $GITHUB_ENV
          echo "ARCH=$ARCH" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=$KBUILD_BUILD_USER" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=$KBUILD_BUILD_HOST" >> $GITHUB_ENV

      - name: Generate defconfig
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/cosmic-clang/bin:$PATH"
          make O=out ARCH=arm64 LLVM=1 nethunter_defconfig

      - name: Build kernel dan hasilkan .deb
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/cosmic-clang/bin:$PATH"
          make O=out ARCH=arm64 LLVM=1 -j$(nproc) bindeb-pkg

      - name: Prepare AnyKernel3
        run: |
          git clone --depth=1 https://github.com/DX4GREY/sandstorm.git AnyKernel

          KERNEL_IMAGE="out/arch/arm64/boot/Image.gz-dtb

          if [ -z "$KERNEL_IMAGE" ]; then
            echo "Kernel image tidak ditemukan!"
            exit 1
          fi

          cp "$KERNEL_IMAGE" AnyKernel/
          
          sed -i 's/kernel.version=.*/kernel.version=4.9.337/' AnyKernel/anykernel.sh
          sed -i 's/device.name1=.*/device.name1=beryllium/' AnyKernel/anykernel.sh
          sed -i 's/kernel.compiler=.*/kernel.compiler=Cosmic Clang/' AnyKernel/anykernel.sh

          AK3_ZIP="AnyKernel-$(date +%Y%m%d-%H%M).zip"

          zip -r9 "../$AK3_ZIP" * \
            -x .git README.md '*placeholder'

          echo "AK3_ZIP=$AK3_ZIP" >> $GITHUB_ENV

      - name: Pack kernel modules
        run: |
          mkdir -p modules_pack/lib/modules

          find out -type f -name "*.ko" \
            -exec cp {} modules_pack/lib/modules/ \;

          MODULE_COUNT=$(find modules_pack -name "*.ko" | wc -l)

          echo "Modules ditemukan: $MODULE_COUNT"

          if [ "$MODULE_COUNT" -eq 0 ]; then
            echo "Tidak ada module, skip"
            exit 0
          fi

          # Strip modules
          if command -v llvm-strip >/dev/null 2>&1; then
            find modules_pack -name "*.ko" \
              -exec llvm-strip --strip-unneeded {} \;
          fi

          MODULES_ZIP="modules-$(date +%Y%m%d-%H%M).zip"

          cd modules_pack

          zip -r9 "../$MODULES_ZIP" *

          echo "MODULES_ZIP=$MODULES_ZIP" >> $GITHUB_ENV

      - name: Kumpulkan file .deb
        run: |
          mkdir -p artifacts
          find . -maxdepth 2 -name "*.deb" -exec mv {} artifacts/ \;
          ls -lh artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-builds
          path: |
            artifacts/*.deb
            *.zip
          if-no-files-found: error
