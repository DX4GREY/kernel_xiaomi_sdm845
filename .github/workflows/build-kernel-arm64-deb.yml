name: Build ARM64 Kernel .deb (Native Clang)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-22.04-arm   # GitHub-hosted ARM64 runner
    timeout-minutes: 180

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install dependencies & native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc libssl-dev ccache rsync \
            libelf-dev libncurses-dev dpkg-dev debhelper \
            clang lld gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup build environment
        run: |
          echo "PATH=/usr/bin:${PATH}" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_COMPAT=arm-linux-gnueabi-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
          echo "HOSTCC=clang" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=builder" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=dlovely-faz" >> $GITHUB_ENV

      - name: Build kernel and generate .deb
        run: |
          make O=out ARCH=arm64 nethunter_defconfig
          make O=out ARCH=arm64 -j$(nproc) bindeb-pkg

      - name: Collect .deb packages
        run: |
          mkdir -p artifacts
          find . -maxdepth 2 -name "*.deb" -exec mv {} artifacts/ \;
          ls -lh artifacts/

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-deb-arm64
          path: artifacts/*.deb
          if-no-files-found: error