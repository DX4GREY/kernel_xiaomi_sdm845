name: Build ARM64 Kernel with Cosmic Clang

on:
  push:
    branches: [ "fourteen" ]
  pull_request:
    branches: [ "fourteen" ]
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchain/cosmic-clang
          key: cosmic-clang-v1-${{ hashFiles('.github/workflows/*') }}
          restore-keys: |
            cosmic-clang-v1-

      - name: Clone Cosmic Clang (jika belum ada di cache)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          if [ ! -d "toolchain/cosmic-clang" ]; then
              git clone --depth 1 "https://gitlab.com/DX4GREY/cosmic-clang.git" toolchain/cosmic-clang
          else
            echo "Toolchain ditemukan di cache, lewati cloning."
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc libssl-dev ccache rsync \
            libelf-dev libncurses-dev dpkg-dev debhelper zip

      - name: Setup build environment
        run: |
          TOOLCHAIN_DIR="$GITHUB_WORKSPACE/toolchain/cosmic-clang"
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          export KBUILD_BUILD_USER=builder
          export KBUILD_BUILD_HOST=dlovely-faz
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export HOSTCC=clang
          export ARCH=arm64

          echo "PATH=$PATH" >> $GITHUB_ENV
          echo "CROSS_COMPILE=$CROSS_COMPILE" >> $GITHUB_ENV
          echo "CROSS_COMPILE_COMPAT=$CROSS_COMPILE_COMPAT" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=$CLANG_TRIPLE" >> $GITHUB_ENV
          echo "CC=$CC" >> $GITHUB_ENV
          echo "HOSTCC=$HOSTCC" >> $GITHUB_ENV
          echo "ARCH=$ARCH" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=$KBUILD_BUILD_USER" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=$KBUILD_BUILD_HOST" >> $GITHUB_ENV

      - name: Generate defconfig
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/cosmic-clang/bin:$PATH"
          make O=out ARCH=arm64 LLVM=1 nethunter_defconfig

      - name: Build kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/cosmic-clang/bin:$PATH"
          make O=out ARCH=arm64 LLVM=1 -j$(nproc)

      - name: Upload Kernel Image.gz-dtb
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: out/arch/arm64/boot/Image.gz-dtb

      - name: Create AnyKernel3 zip for beryllium
        run: |
          if [ ! -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "Image.gz-dtb tidak ditemukan!"
            exit 1
          fi

          AK3_DIR="AnyKernel3-beryllium"
          ZIP_NAME="AnyKernel3-beryllium-${GITHUB_RUN_NUMBER}.zip"

          rm -rf "$AK3_DIR" "$ZIP_NAME"
          rsync -a --exclude=".git" kali-nethunter-kernel-builder/anykernel3/ "$AK3_DIR/"
          cp out/arch/arm64/boot/Image.gz-dtb "$AK3_DIR/Image.gz-dtb"

          cat > "$AK3_DIR/anykernel.sh" <<'EOF'
          # AnyKernel3 Ramdisk Mod Script
          # osm0sis @ xda-developers

          ## AnyKernel setup
          # begin properties
          properties() { '
          kernel.string=NetHunter Kernel for Xiaomi Poco F1
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=beryllium
          device.name2=POCO F1
          device.name3=Poco F1
          device.name4=Xiaomi Poco F1
          supported.versions=
          supported.patchlevels=
          '; } # end properties

          # shell variables
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;

          ## AnyKernel methods (DO NOT CHANGE)
          . tools/ak3-core.sh;

          ## AnyKernel install
          dump_boot;
          write_boot;
          ## end install
          EOF

          cd "$AK3_DIR"
          zip -r9 "../$ZIP_NAME" . -x "*.git*" "README.md" "*.zip"

      - name: Upload AnyKernel3 beryllium zip
        uses: actions/upload-artifact@v4
        with:
          name: anykernel3-beryllium
          path: AnyKernel3-beryllium-*.zip
      
      - name: Collect kernel modules
        run: |
          # collect all .ko files preserving directory structure
          mkdir -p modules
          find out -name "*.ko" -print0 | xargs -0 -I{} bash -c 'mkdir -p "modules/$(dirname {})"; cp -a "{}" "modules/{}"'

      - name: Upload kernel modules
        uses: actions/upload-artifact@v4
        with:
          name: kernel-modules
          path: modules/
