name: Build ARM64 Kernel .deb with Cosmic Clang

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchain/cosmic-clang
          key: cosmic-clang-v1-${{ hashFiles('.github/workflows/*') }}
          restore-keys: |
            cosmic-clang-v1-

      - name: Clone Cosmic Clang (jika belum ada di cache)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 "https://gitlab.com/DX4GREY/cosmic-clang.git" \
            toolchain/cosmic-clang

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc libssl-dev ccache rsync \
            libelf-dev libncurses-dev dpkg-dev debhelper

      - name: Setup build environment
        run: |
          TOOLCHAIN_DIR="$GITHUB_WORKSPACE/toolchain/cosmic-clang"
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          export KBUILD_BUILD_USER=builder
          export KBUILD_BUILD_HOST=dlovely-faz
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export HOSTCC=clang
          export ARCH=arm64

          echo "PATH=$PATH" >> $GITHUB_ENV
          echo "CROSS_COMPILE=$CROSS_COMPILE" >> $GITHUB_ENV
          echo "CROSS_COMPILE_COMPAT=$CROSS_COMPILE_COMPAT" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=$CLANG_TRIPLE" >> $GITHUB_ENV
          echo "CC=$CC" >> $GITHUB_ENV
          echo "HOSTCC=$HOSTCC" >> $GITHUB_ENV
          echo "ARCH=$ARCH" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=$KBUILD_BUILD_USER" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=$KBUILD_BUILD_HOST" >> $GITHUB_ENV

      - name: Generate defconfig
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/cosmic-clang/bin:$PATH"
          make O=out ARCH=arm64 nethunter_defconfig

      - name: Build kernel dan hasilkan .deb
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/cosmic-clang/bin:$PATH"
          make O=out ARCH=arm64 -j$(nproc) bindeb-pkg

      - name: Kumpulkan file .deb
        run: |
          mkdir -p artifacts
          find . -maxdepth 2 -name "*.deb" -exec mv {} artifacts/ \;
          ls -lh artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-deb-cosmic
          path: artifacts/*.deb
          if-no-files-found: error